<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>আলিফিয়া ইলম | ক্লাসরুম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1D33;--navy2:#122A49;--gold:#C9A227;--soft:#E4C76B;--line:#22394F;--ok:#1E9E62}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri',sans-serif;background:var(--navy);color:#fff;overscroll-behavior:none}
.ar{font-family:'Scheherazade New',serif;direction:rtl}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--navy2);border-bottom:1px solid var(--line);
padding:10px 14px;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{font-size:12px;color:#8FA6BE}
.tg{border:1px solid var(--line);background:#0E2338;color:#8FA6BE;padding:8px 12px;border-radius:8px;
font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tg.on{border-color:var(--gold);color:var(--gold);background:rgba(201,162,39,.12)}

/* progress */
.pw{height:4px;background:#0A1826}
.pb{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--soft));transition:.4s}

/* lesson tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 16px;border-radius:20px;border:1px solid var(--line);
background:#0E2338;color:#8FA6BE;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tab.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:6px 14px 100px}
.cell{aspect-ratio:1;background:var(--navy2);border:1px solid var(--line);border-radius:14px;
display:grid;place-items:center;position:relative;cursor:pointer;transition:.18s}
.cell:active{transform:scale(.94)}
.cell .l{font-family:'Scheherazade New',serif;font-size:42px;line-height:1;color:#fff;padding-bottom:6px}
.cell .n{position:absolute;bottom:7px;font-size:11px;color:#7E93A9}
.cell.done{border-color:var(--ok)}
.cell.done::after{content:"✓";position:absolute;top:5px;right:8px;color:var(--ok);font-size:12px;font-weight:700}
.cell.sel{border-color:var(--gold);background:rgba(201,162,39,.16);box-shadow:0 0 0 2px rgba(201,162,39,.3)}

/* focus view */
.focus{position:fixed;inset:0;z-index:40;background:var(--navy);display:none;flex-direction:column}
.focus.on{display:flex}
.fx{padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.x{border:none;background:#0E2338;color:#8FA6BE;width:38px;height:38px;border-radius:10px;font-size:20px;cursor:pointer}
.fbig{flex:1;display:grid;place-items:center;padding:10px}
.fbig .letter{font-family:'Scheherazade New',serif;font-size:clamp(130px,44vw,260px);line-height:1;
color:#fff;text-shadow:0 0 60px rgba(201,162,39,.25)}
.fmeta{text-align:center;padding:0 20px 14px}
.fmeta .name{font-size:24px;font-weight:600;color:var(--soft)}
.note{margin:14px 14px 0;background:#0E2338;border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:10px;padding:14px;font-size:15px;color:#C7D2E0;display:none;text-align:left}
.note.on{display:block}
.note b{color:var(--gold);display:block;margin-bottom:4px;font-size:13px;letter-spacing:1px}
.fnav{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:var(--navy2)}
.fnav button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0E2338;
color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.fnav .mark{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.fnav .mark.done{background:var(--ok);border-color:var(--ok);color:#fff}

/* bottom */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--navy2);
border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
.foot button{border:1px solid var(--line);background:#0E2338;color:#fff;padding:12px 18px;
border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.foot button:disabled{opacity:.35}
.foot .mid{flex:1;text-align:center;font-size:13px;color:#8FA6BE}

/* toast */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:60;
background:#0E2338;border:1px solid var(--gold);color:var(--soft);padding:12px 18px;border-radius:10px;
font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

@media(min-width:620px){.grid{grid-template-columns:repeat(6,1fr);max-width:820px;margin:0 auto}}
</style>
</head>
<body>

<div class="bar">
  <button class="x" onclick="location.href='index.html'">‹</button>
  <div class="t"><b id="ttl">পাঠ ১</b><span id="sub">—</span></div>
  <button class="tg" id="tbtn" onclick="toggleT()">উস্তাদ</button>
</div>
<div class="pw"><div class="pb" id="pb"></div></div>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="foot">
  <button id="prev" onclick="go(-1)">‹ আগের</button>
  <div class="mid" id="mid">—</div>
  <button id="next" onclick="go(1)">পরের ›</button>
</div>

<div class="focus" id="focus">
  <div class="fx">
    <button class="x" onclick="closeF()">✕</button>
    <div class="t"><b id="fttl">—</b><span id="fsub">—</span></div>
  </div>
  <div class="fbig"><div class="letter ar" id="fl">ا</div></div>
  <div class="fmeta">
    <div class="name" id="fn">—</div>
    <div class="note" id="fnote"><b>উস্তাদের নোট</b><span id="fnt"></span></div>
  </div>
  <div class="fnav">
    <button onclick="step(-1)">‹</button>
    <button class="mark" id="mk" onclick="mark()">শেখা হয়েছে</button>
    <button onclick="step(1)">›</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   এই অংশটাই শুধু এডিট করবেন — নতুন পাঠ বা হরফ যোগ করতে
   ═══════════════════════════════════════════════════════ */
const LESSONS = [
{
 title:"পাঠ ১ — পরিচিত হরফ",
 sub:"যেগুলোর উচ্চারণ বাংলার কাছাকাছি",
 items:[
  {ar:"ا",bn:"আলিফ",note:"মুখ স্বাভাবিক রেখে টেনে 'আ' — গলা চাপবে না।"},
  {ar:"ب",bn:"বা",note:"দুই ঠোঁট মিলিয়ে হালকা ফাটিয়ে 'বা'। বাংলার ব-এর মতোই।"},
  {ar:"ت",bn:"তা",note:"জিহ্বার আগা উপরের সামনের দাঁতের গোড়ায়। নরম 'তা', জোর দেবেন না।"},
  {ar:"د",bn:"দাল",note:"তা-এর মতোই জায়গা, কিন্তু আওয়াজ ভারী ও আটকানো — 'দ'।"},
  {ar:"ر",bn:"রা",note:"জিহ্বার আগা হালকা কাঁপবে। বেশি ঘোরাবেন না, এক কাঁপুনিই যথেষ্ট।"},
  {ar:"ز",bn:"যা",note:"দাঁতের ফাঁক দিয়ে শিসের মতো 'য'। বাংলা 'জ' বলবেন না।"},
  {ar:"س",bn:"সীন",note:"পাতলা শিস — 'স'। জিহ্বার আগা নিচের দাঁতের পেছনে।"},
  {ar:"ف",bn:"ফা",note:"উপরের দাঁত নিচের ঠোঁটে ছোঁয়াবেন — 'ফ'। প-এর মতো নয়।"},
  {ar:"ك",bn:"কাফ",note:"জিহ্বার পেছন দিক তালুতে — হালকা 'ক', পেট থেকে নয়।"},
  {ar:"ل",bn:"লাম",note:"জিহ্বার আগা তালুর সামনে — পরিষ্কার 'ল'।"},
  {ar:"م",bn:"মীম",note:"দুই ঠোঁট বন্ধ, নাকে হালকা আওয়াজ — 'ম'।"},
  {ar:"ن",bn:"নূন",note:"জিহ্বার আগা দাঁতের গোড়ায়, নাক দিয়ে আওয়াজ — 'ন'।"},
  {ar:"و",bn:"ওয়াও",note:"ঠোঁট গোল করে 'ওয়া'। ভ বা ব বলবেন না।"},
  {ar:"ي",bn:"ইয়া",note:"জিহ্বার মধ্যভাগ তালুর দিকে — 'ইয়া'।"},
  {ar:"ه",bn:"হা",note:"গলার একদম শেষ থেকে হালকা নিঃশ্বাসের 'হ'। বুকে চাপ নয়।"}
 ]
},
{
 title:"পাঠ ২ — মনোযোগের হরফ",
 sub:"বাংলায় নেই, তাই আলাদা অভ্যাস লাগবে",
 items:[
  {ar:"ث",bn:"সা",note:"জিহ্বার আগা উপরের দাঁতের মাথায় ঠেকবে — ইংরেজি 'th'-এর মতো। س নয়।"},
  {ar:"ج",bn:"জীম",note:"জিহ্বার মধ্যভাগ তালুতে চেপে 'জ'। ز-এর শিস আসবে না।"},
  {ar:"ح",bn:"হা (মোটা)",note:"গলার মাঝখান থেকে চাপ দিয়ে — ه-এর চেয়ে ভারী। ছাত্রকে গলায় হাত দিয়ে অনুভব করাবেন।"},
  {ar:"خ",bn:"খা",note:"গলার উপরের দিক থেকে খসখসে 'খ' — কফ তোলার মতো ভাব।"},
  {ar:"ذ",bn:"যাল",note:"জিহ্বার আগা দাঁতের মাথায়, কিন্তু আওয়াজ ভারী — ث-এর ভারী রূপ।"},
  {ar:"ش",bn:"শীন",note:"জিহ্বা ছড়িয়ে তালুতে — 'শ'। س-এর চেয়ে চওড়া আওয়াজ।"},
  {ar:"ص",bn:"সোয়াদ",note:"মোটা 'স' — মুখ ভরে, ঠোঁট একটু গোল। س আর ص পাশাপাশি অভ্যাস করাবেন।"},
  {ar:"ض",bn:"দোয়াদ",note:"জিহ্বার পাশ উপরের মোলার দাঁতে চেপে ভারী 'দ'। সবচেয়ে কঠিন হরফ — ধৈর্য ধরবেন।"},
  {ar:"ط",bn:"তোয়া",note:"মোটা ও আটকানো 'ত' — ت-এর ভারী রূপ, আওয়াজ ফেটে বের হবে।"},
  {ar:"ظ",bn:"যোয়া",note:"জিহ্বার আগা দাঁতের মাথায় + মুখ ভারী — ذ-এর মোটা রূপ।"},
  {ar:"ع",bn:"আইন",note:"গলার মাঝখান চেপে 'আ'। ছাত্র প্রথমে পারবে না — ح দিয়ে শুরু করিয়ে ধীরে আনবেন।"},
  {ar:"غ",bn:"গইন",note:"গলার উপর থেকে গড়গড়ে 'গ' — خ-এর আওয়াজযুক্ত রূপ।"},
  {ar:"ق",bn:"ক্বাফ",note:"জিহ্বার একদম পেছন, গলার কাছে — ভারী 'ক্ব'। ك আর ق পাশাপাশি শোনাবেন।"},
  {ar:"ء",bn:"হামযা",note:"গলা এক মুহূর্তের জন্য পুরো বন্ধ — 'আ' ধাক্কা দিয়ে বের হবে।"}
 ]
},
{
 title:"পাঠ ৩ — হরকত",
 sub:"যবর · যের · পেশ দিয়ে হরফ পড়া",
 items:[
  {ar:"بَ",bn:"বা (যবর)",note:"যবর = উপরে দাগ, আওয়াজ 'আ'। মুখ খুলবে।"},
  {ar:"بِ",bn:"বি (যের)",note:"যের = নিচে দাগ, আওয়াজ 'ই'। মুখ চওড়া হবে।"},
  {ar:"بُ",bn:"বু (পেশ)",note:"পেশ = উপরে ছোট ওয়াও, আওয়াজ 'উ'। ঠোঁট গোল হবে।"},
  {ar:"تَ",bn:"তা",note:"একই নিয়মে তা পড়ান।"},
  {ar:"تِ",bn:"তি",note:"ঠোঁট নয়, জিহ্বায় মন দিন।"},
  {ar:"تُ",bn:"তু",note:"ঠোঁট গোল করা বাধ্যতামূলক।"},
  {ar:"مَ",bn:"মা",note:"নাকের আওয়াজ যেন থাকে।"},
  {ar:"مِ",bn:"মি",note:"—"},
  {ar:"مُ",bn:"মু",note:"—"},
  {ar:"بْ",bn:"ব্‌ (জযম)",note:"জযম = আওয়াজ থেমে যাবে, হরকত নেই।"},
  {ar:"بّ",bn:"ব্ব (তাশদীদ)",note:"তাশদীদ = হরফ দুইবার, একটু চেপে ধরে পড়বে।"},
  {ar:"بَا",bn:"বা (মদ)",note:"মদ = দুই আলিফ পরিমাণ টান। গুনে গুনে টানা শেখাবেন।"}
 ]
},
{
 title:"পাঠ ৪ — শব্দ পড়া",
 sub:"হরফ জোড়া লাগিয়ে আসল পড়া",
 items:[
  {ar:"اَحَد",bn:"আহাদ",note:"ح-তে গলার চাপ ধরে রাখতে বলবেন।"},
  {ar:"رَبّ",bn:"রব্ব",note:"তাশদীদের জন্য ب দুইবার।"},
  {ar:"نَصْر",bn:"নাসর",note:"ص মোটা — নাসর, 'নসর' নয়।"},
  {ar:"قُلْ",bn:"ক্বুল",note:"ق গলার পেছন থেকে, ঠোঁট গোল।"},
  {ar:"عَبْد",bn:"আব্দ",note:"ع দিয়ে শুরু — প্রথমে কঠিন লাগবে।"},
  {ar:"حَمْد",bn:"হাম্‌দ",note:"م-এ নাকের আওয়াজ, ح মোটা।"},
  {ar:"مُحَمَّد",bn:"মুহাম্মাদ",note:"م-এ তাশদীদ — চেপে ধরে পড়বে।"},
  {ar:"بِسْمِ",bn:"বিসমি",note:"س পাতলা শিস।"},
  {ar:"اَللّٰه",bn:"আল্লাহ",note:"লাম-এ তাশদীদ + মদের টান।"},
  {ar:"اَلْحَمْدُ",bn:"আলহামদু",note:"এখানেই সূরা ফাতিহার শুরু — ছাত্রকে বুঝিয়ে দিন সে এখন কুরআন পড়ছে।"}
 ]
}
];
/* ═══════════ এর নিচে হাত দেওয়ার দরকার নেই ═══════════ */

let L=0, F=-1, T=false;
const done = JSON.parse(localStorage.getItem('ai_done')||'{}');
const $ = id=>document.getElementById(id);
const key=(l,i)=>l+'-'+i;
const total = LESSONS.reduce((a,x)=>a+x.items.length,0);

function tabs(){
  $('tabs').innerHTML = LESSONS.map((x,i)=>
    `<button class="tab ${i==L?'on':''}" onclick="setL(${i})">${x.title.split('—')[0].trim()}</button>`).join('');
}
function render(){
  const s=LESSONS[L];
  $('ttl').textContent=s.title; $('sub').textContent=s.sub;
  $('grid').innerHTML = s.items.map((it,i)=>
    `<div class="cell ${done[key(L,i)]?'done':''}" id="c${i}" onclick="openF(${i})">
       <div class="l ar">${it.ar}</div><div class="n">${it.bn}</div></div>`).join('');
  $('mid').textContent = `পাঠ ${L+1} / ${LESSONS.length}`;
  $('prev').disabled = L==0; $('next').disabled = L==LESSONS.length-1;
  const c = Object.keys(done).length;
  $('pb').style.width = (c/total*100)+'%';
  tabs();
}
function setL(i){L=i;F=-1;render();window.scrollTo(0,0);}
function go(d){ if(LESSONS[L+d]) setL(L+d); }

function openF(i){
  F=i; const it=LESSONS[L].items[i];
  $('fl').textContent=it.ar; $('fn').textContent=it.bn;
  $('fttl').textContent=LESSONS[L].title; $('fsub').textContent=`${i+1} / ${LESSONS[L].items.length}`;
  $('fnt').textContent=it.note||'—';
  $('fnote').className = T?'note on':'note';
  const d=!!done[key(L,i)];
  $('mk').textContent = d?'✓ শেখা হয়েছে':'শেখা হয়েছে';
  $('mk').className = d?'mark done':'mark';
  $('focus').classList.add('on');
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('sel'));
  $('c'+i)?.classList.add('sel');
  sync();
}
function closeF(){ $('focus').classList.remove('on'); }
function step(d){ const n=F+d; if(LESSONS[L].items[n]) openF(n); }
function mark(){
  const k=key(L,F);
  if(done[k]) delete done[k]; else done[k]=1;
  localStorage.setItem('ai_done',JSON.stringify(done));
  const d=!!done[k];
  $('mk').textContent=d?'✓ শেখা হয়েছে':'শেখা হয়েছে';
  $('mk').className=d?'mark done':'mark';
  const c=Object.keys(done).length;
  $('pb').style.width=(c/total*100)+'%';
  toast(`${c} / ${total} টি শেখা হয়েছে`);
}
function toggleT(){
  T=!T;
  $('tbtn').className = T?'tg on':'tg';
  $('fnote').className = T?'note on':'note';
  toast(T?'উস্তাদ মোড চালু — নোট দেখা যাচ্ছে':'উস্তাদ মোড বন্ধ');
}
let tm;
function toast(m){ $('toast').textContent=m; $('toast').classList.add('on');
  clearTimeout(tm); tm=setTimeout(()=>$('toast').classList.remove('on'),1800); }

/* লাইভ সংযোগের জায়গা — ধাপ ৩-এ Firebase বসবে এখানে */
function sync(){ /* পরে: রুমে পাঠ ও হরফের নম্বর পাঠানো হবে */ }

/* সোয়াইপ */
let x0=null;
addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)<60)return;
  if($('focus').classList.contains('on')) step(dx>0?-1:1); else go(dx>0?-1:1);
},{passive:true});

render();
</script>
